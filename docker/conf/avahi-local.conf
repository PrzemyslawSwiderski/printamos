server:
    # 1. Security: Allow Unbound to talk to the local avahi2dns stub
    do-not-query-localhost: no

    # 2. Trust: Tell Unbound that .local is a legitimate local zone
    domain-insecure: "local."
    private-domain: "local."
    local-zone: "local." nodefault

# 3. Routing: Forward all .local queries to the avahi2dns port
forward-zone:
    name: "local."
    forward-addr: 127.0.0.1@5354